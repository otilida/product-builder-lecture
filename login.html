<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 - 로또 번호 추천</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Arial, "맑은 고딕", sans-serif;
            background: #121212;
            color: #eeeeee;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            width: 90%;
            max-width: 420px;
            background: #1e1e1e;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
        }
        h1 { text-align: center; margin-top: 0; margin-bottom: 10px; color: #ffffff; }
        button {
            display: block;
            margin: 30px auto 0;
            border: none;
            padding: 15px 40px;
            font-size: 18px;
            font-weight: bold;
            color: white;
            background-color: #444444;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.2s;
        }
        button:hover { background-color: #666666; transform: translateY(-2px); }
        button:disabled { opacity: 0.6; cursor: default; transform: none; }
    </style>
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>
<div class="container">
    <h1>로그인</h1>
    <form id="loginForm" class="auth-form" novalidate>
        <label for="email">이메일</label>
        <input type="email" id="email" autocomplete="email" required>

        <label for="password">비밀번호</label>
        <input type="password" id="password" autocomplete="current-password" required>

        <button type="submit" id="submitBtn">로그인</button>
    </form>
    <div class="auth-message" id="message" role="status"></div>
    <div class="auth-links">계정이 없나요? <a href="signup.html">회원가입</a></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/auth.js"></script>
<script>
    var form = document.getElementById("loginForm");
    var msg = document.getElementById("message");
    var btn = document.getElementById("submitBtn");

    form.addEventListener("submit", async function (e) {
        e.preventDefault();
        var email = document.getElementById("email").value.trim();
        var password = document.getElementById("password").value;

        btn.disabled = true;
        msg.textContent = "";

        var res = await window.sb.auth.signInWithPassword({ email: email, password: password });
        btn.disabled = false;

        if (res.error) {
            if ((res.error.message || "") === "Email not confirmed") {
                msg.textContent = "이메일 확인이 필요합니다. 받은 메일의 링크를 눌러 주세요.";
            } else {
                msg.textContent = "이메일 또는 비밀번호를 확인해 주세요";
            }
            msg.className = "auth-message error";
            return;
        }
        location.href = "index.html";
    });
</script>
</body>
</html>
