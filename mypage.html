<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>마이페이지 - 로또 번호 추천</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Arial, "맑은 고딕", sans-serif;
            background: #121212;
            color: #eeeeee;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            width: 90%;
            max-width: 480px;
            background: #1e1e1e;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
        }
        h1 { text-align: center; margin-top: 0; margin-bottom: 10px; color: #ffffff; }
        button {
            display: block;
            margin: 30px auto 0;
            border: none;
            padding: 15px 40px;
            font-size: 18px;
            font-weight: bold;
            color: white;
            background-color: #444444;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.2s;
        }
        button:hover { background-color: #666666; transform: translateY(-2px); }
        button:disabled { opacity: 0.6; cursor: default; transform: none; }
    </style>
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>
<div class="container">
    <h1>마이페이지</h1>

    <div id="loading" class="auth-message">불러오는 중...</div>

    <div id="content" hidden>
        <!-- 내 정보 -->
        <div class="mypage-section" style="border-top:none; padding-top:0; margin-top:16px;">
            <h2>내 정보</h2>
            <div class="info-row"><span>이메일</span><span id="infoEmail"></span></div>
            <div class="info-row"><span>가입 방식</span><span id="infoProvider"></span></div>
            <div class="info-row"><span>가입일</span><span id="infoCreated"></span></div>
            <div class="info-row"><span>마지막 로그인</span><span id="infoLast"></span></div>
        </div>

        <!-- 비밀번호 변경 -->
        <div class="mypage-section">
            <h2>비밀번호 변경</h2>
            <form id="pwForm" class="auth-form" novalidate>
                <label for="newPassword">새 비밀번호 (6자 이상)</label>
                <input type="password" id="newPassword" autocomplete="new-password" minlength="6" required>

                <label for="newPassword2">새 비밀번호 확인</label>
                <input type="password" id="newPassword2" autocomplete="new-password" minlength="6" required>

                <button type="submit" id="pwBtn">비밀번호 변경</button>
            </form>
            <p class="hint">Google로 가입한 경우 여기서 비밀번호를 설정하면 이메일로도 로그인할 수 있습니다.</p>
            <div class="auth-message" id="pwMessage" role="status"></div>
        </div>

        <!-- 회원 탈퇴 -->
        <div class="mypage-section">
            <h2>회원 탈퇴</h2>
            <p class="hint">탈퇴하면 계정이 삭제되며 되돌릴 수 없습니다.</p>
            <form id="delForm" class="auth-form" novalidate>
                <label for="delConfirm">확인을 위해 이메일을 입력해 주세요</label>
                <input type="email" id="delConfirm" autocomplete="off" required>
                <button type="submit" id="delBtn" class="danger-btn">회원 탈퇴</button>
            </form>
            <div class="auth-message" id="delMessage" role="status"></div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/auth.js"></script>
<script>
    var currentUser = null;

    function show(el, text, type) {
        el.textContent = text;
        el.className = "auth-message " + (type || "");
    }

    function fmt(iso) {
        return iso ? new Date(iso).toLocaleString("ko-KR") : "-";
    }

    function providerName(user) {
        var list = (user.app_metadata && user.app_metadata.providers) || [];
        var names = list.map(function (p) { return p === "email" ? "이메일" : p === "google" ? "Google" : p; });
        return names.length ? names.join(", ") : "-";
    }

    function renderUser(user) {
        currentUser = user;
        document.getElementById("infoEmail").textContent = user.email || "-";
        document.getElementById("infoProvider").textContent = providerName(user);
        document.getElementById("infoCreated").textContent = fmt(user.created_at);
        document.getElementById("infoLast").textContent = fmt(user.last_sign_in_at);
        document.getElementById("loading").hidden = true;
        document.getElementById("content").hidden = false;
    }

    // 로그인 확인 (재설정 메일 링크로 들어온 경우 SDK가 자동으로 세션을 만들어 줍니다)
    window.sb.auth.getSession().then(function (res) {
        if (!res.data.session) {
            location.href = "login.html";
            return;
        }
        renderUser(res.data.session.user);
    });

    // 비밀번호 변경
    var pwMsg = document.getElementById("pwMessage");
    document.getElementById("pwForm").addEventListener("submit", async function (e) {
        e.preventDefault();
        var p1 = document.getElementById("newPassword").value;
        var p2 = document.getElementById("newPassword2").value;

        if (p1.length < 6) { show(pwMsg, "비밀번호는 6자 이상이어야 합니다.", "error"); return; }
        if (p1 !== p2) { show(pwMsg, "비밀번호가 서로 일치하지 않습니다.", "error"); return; }

        var btn = document.getElementById("pwBtn");
        btn.disabled = true;
        var res = await window.sb.auth.updateUser({ password: p1 });
        btn.disabled = false;

        if (res.error) {
            var m = (res.error.message || "").toLowerCase();
            if (m.indexOf("different") !== -1 || m.indexOf("same") !== -1) {
                show(pwMsg, "기존 비밀번호와 다른 비밀번호를 입력해 주세요.", "error");
            } else if (m.indexOf("reauth") !== -1) {
                show(pwMsg, "보안을 위해 다시 로그인한 뒤 변경해 주세요.", "error");
            } else {
                show(pwMsg, "비밀번호를 변경하지 못했습니다. 잠시 후 다시 시도해 주세요.", "error");
            }
            return;
        }
        document.getElementById("pwForm").reset();
        show(pwMsg, "비밀번호가 변경되었습니다.", "success");
    });

    // 회원 탈퇴 (supabase/delete_account.sql 의 delete_my_account 함수 필요)
    var delMsg = document.getElementById("delMessage");
    document.getElementById("delForm").addEventListener("submit", async function (e) {
        e.preventDefault();
        var typed = document.getElementById("delConfirm").value.trim().toLowerCase();
        if (!currentUser || typed !== (currentUser.email || "").toLowerCase()) {
            show(delMsg, "입력한 이메일이 내 이메일과 다릅니다.", "error");
            return;
        }
        if (!confirm("정말 탈퇴하시겠습니까? 계정이 삭제되며 되돌릴 수 없습니다.")) return;

        var btn = document.getElementById("delBtn");
        btn.disabled = true;
        var res = await window.sb.rpc("delete_my_account");
        if (res.error) {
            btn.disabled = false;
            show(delMsg, "탈퇴 처리에 실패했습니다. 잠시 후 다시 시도해 주세요.", "error");
            return;
        }
        await window.sb.auth.signOut();
        alert("탈퇴가 완료되었습니다.");
        location.href = "index.html";
    });
</script>
</body>
</html>
